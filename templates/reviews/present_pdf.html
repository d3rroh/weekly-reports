<!doctype html>
<html><head><meta charset="utf-8"><title>Weekly Outcomes Review {{ period.label }}</title>
<style>
@page { size: a4 portrait; margin: 1.6cm 1.5cm 1.8cm 1.5cm;
  @frame footer { -pdf-frame-content: pdf-footer; bottom: 0.8cm; margin-left: 1.5cm; margin-right: 1.5cm; height: 0.6cm; } }
body { font-family: Helvetica, Arial, sans-serif; font-size: 9.5pt; color: #1a2030; line-height: 1.35; }
header.cover { background-color: #0e1a2e; color: #dfe5f0; padding: 14px 16px 12px 16px; margin-bottom: 10px; }
header.cover h1 { color: #ffffff; font-size: 20pt; margin: 4px 0 6px 0; }
header.cover .eyebrow { color: #8fb0e9; font-size: 7.5pt; text-transform: uppercase; }
header.cover .meta { font-size: 8.5pt; color: #9aa7bd; }
header.cover .meta strong { color: #ffffff; }
header.cover .notice { background-color: #fbf1df; }
table.glance { width: 100%; margin: 4px 0 6px 0; }
table.glance td { width: 25%; border: 0.5px solid #cfcbc0; background-color: #faf9f6; padding: 6px 8px; vertical-align: top; }
.g-label { font-size: 7pt; text-transform: uppercase; color: #646b78; }
.g-value { font-size: 15pt; font-weight: bold; color: #141b2b; }
.g-change { font-size: 8pt; }
.g-prev { font-size: 7.5pt; color: #646b78; }
h1 { font-size: 17pt; margin: 2px 0 4px; color: #0d1726; }
h2 { font-size: 11.5pt; color: #0d1726; border-bottom: 1px solid #c6ccd6; padding-bottom: 2px; margin: 14px 0 6px; -pdf-keep-with-next: true; }
h2 .n { color: #2856c7; }
h3 { font-size: 9.5pt; margin: 8px 0 3px; -pdf-keep-with-next: true; }
.muted { color: #5c6575; }
.small { font-size: 8pt; }
.block-label { font-size: 7.5pt; text-transform: uppercase; color: #5c6575; margin-top: 4px; }
.pre { white-space: pre-wrap; }
.not-answered { color: #5c6575; font-style: italic; }
.notice { border: 1px solid #b45309; color: #6b3f05; padding: 4px 6px; margin-top: 6px; }
.mgmt-comment { border-left: 2px solid #2856c7; padding: 2px 6px; margin: 4px 0; background-color: #eef3fd; }
table.ptable { width: 100%; border: 0.5px solid #c6ccd6; margin: 4px 0; }
table.ptable th { background-color: #eef0f4; font-size: 8pt; text-align: left; padding: 3px 4px; }
table.ptable td { padding: 3px 4px; border-top: 0.5px solid #dfe3ea; vertical-align: top; }
.num { text-align: right; }
.trend-improved { color: #17703a; font-weight: bold; }
.trend-deteriorated { color: #b3261e; font-weight: bold; }
.trend-unchanged, .trend-not_available { color: #525b6b; }
</style></head>
<body>
<div id="pdf-footer" class="small muted">{{ review.code }} · {{ period.label }} · Generated {{ generated_at|date:"j M Y, H:i" }} · Page <pdf:pagenumber> of <pdf:pagecount></div>
{% include "reviews/_present_body.html" %}
</body></html>
