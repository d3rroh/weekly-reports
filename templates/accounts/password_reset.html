{% extends "base_auth.html" %}
{% block auth %}
<h1>Reset password</h1>
<p class="muted">Enter the email address on your account. If it matches an active user, a reset link will be sent.</p>
<form method="post">{% csrf_token %}
  {% include "partials/field.html" with field=form.email %}
  <button type="submit" class="btn btn-primary">Send reset link</button>
  <p class="auth-foot"><a href="{% url 'accounts:login' %}">Back to sign in</a></p>
</form>
{% endblock %}
