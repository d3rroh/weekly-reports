# Template for the app's secret. Copy it to weekly-reports-secret.yaml (which
# is git-ignored), fill in the values, and apply it before weekly-reports.yaml:
#
#   cp deploy/k3s/weekly-reports-secret.example.yaml deploy/k3s/weekly-reports-secret.yaml
#   kubectl apply -f deploy/k3s/weekly-reports-secret.yaml
#
# Values under stringData are plain text; Kubernetes base64-encodes them.
# Generate them with:
#   DJANGO_SECRET_KEY:            python3 -c 'import secrets; print(secrets.token_urlsafe(50))'
#   DB_PASSWORD, MYSQL_ROOT_PASSWORD:  openssl rand -base64 24
#
# MySQL reads the passwords only when it first creates its data volume.
# Changing them here later does not change them in the database.
apiVersion: v1
kind: Secret
metadata:
  name: weekly-reports
  namespace: weekly-reports
type: Opaque
stringData:
  DJANGO_SECRET_KEY: ""
  DB_PASSWORD: ""
  MYSQL_ROOT_PASSWORD: ""
  EMAIL_HOST_PASSWORD: ""
